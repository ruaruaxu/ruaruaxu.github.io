- title: "跨界融城 · 高线驿站 / Huanggang Border and Fulin Port"
  card_title: "跨界融城 · 高线驿站"
  year: 2023
  place: "Shenzhen–Hong Kong border, China"
  subtitle: "Shenzhen–Hong Kong"
  country: "China"
  kind: "Urban Planning and Architectural Design"
  photo_title: "跨界融城 — A Connected Riverfront"
  image: "/assets/img/portfolio/huanggang-border-planning/riverfront-aerial.webp"
  image_large: "/assets/img/portfolio/huanggang-border-planning/riverfront-aerial.webp"
  alt: "Riverfront aerial of the Huanggang border planning proposal by Wenrui Xu"
  description: "Shenzhen–Hong Kong border, China.\n2023 graduation design by Wenrui Xu. Huanggang border-area planning and the Fulin port, cross-border hotel, and education complex."
  count: 10
  aspect: "2560 / 1191"
  layout_span: 2
  photos:
    - title: "跨界融城 — A Connected Riverfront"
      description: "Shenzhen–Hong Kong border, China.\nThe planning proposal reorganizes the Huanggang border area as a connected riverfront district. Functional zoning and a layered transport network link the development areas to shared open space."
      aspect: "2560 / 1191"
      image: "/assets/img/portfolio/huanggang-border-planning/riverfront-aerial.webp"
    - title: "高线驿站 — 福邻口岸综合体 / Fulin Port Complex"
      description: "Shenzhen–Hong Kong border, China.\nThe Fulin port, cross-border hotel, and education complex brings border crossing, hospitality, and teaching into a layered building. An elevated autonomous-shuttle loop connects the raised volumes and the port below."
      aspect: "2560 / 1175"
      image: "/assets/img/portfolio/fulin-port-complex/overall-axonometric.webp"
    - title: "Functional Structure"
      description: "Shenzhen–Hong Kong border, China.\nResidential, medical technology, information technology, port, comprehensive-service, and small-scale R&D areas are organized around a shared border landscape."
      aspect: "1839 / 1080"
      image: "/assets/img/portfolio/huanggang-border-planning/functional-structure.webp"
    - title: "Layered Transport Systems"
