      description: |
        China.
        Terrain organizes the guesthouse. The slope separates public and private domains while stepped roofs relate the building to the village.
        Selected for 胡滨《建筑设计教学档案》(2024) and featured in 胡滨’s article in 建筑学报 / Architectural Journal (2023).
      aspect: 1920 / 1280
      image: /assets/img/portfolio/room-within-room/model-01.webp
    - title: "Concept — Public and Private Routes"
      description: |
        China.
        Public and guest routes meet at the village book bar. The concept diagrams connect circulation, terrain, and different ways of inhabiting the guesthouse.
      aspect: 2560 / 1207
      image: /assets/img/portfolio/room-within-room/drawing-01.webp
    - title: "Plan — A Shared Point Between Two Routes"
      description: |
        China.
        The ground-floor plan makes the circulation strategy explicit. Public spaces and guest accommodation follow distinct routes, with the book bar as their shared point.
      aspect: 2560 / 1809
      image: /assets/img/portfolio/room-within-room/drawing-04.webp
    - title: "Section — Rooms Across the Slope"
      description: |
        China.
        Sections test the design across the slope. They show how changes in level connect enclosed rooms, outdoor circulation, and the cliffside plaza.
      aspect: 2560 / 1809
      image: /assets/img/portfolio/room-within-room/drawing-03.webp
    - title: "Spatial Model — A Room Within a Room"
      description: |
        China.
        A room within a room gives the attic its spatial identity. The cutaway model tests nested volumes and the stair as part of the inhabitable interior.
      aspect: 1920 / 1280
      image: /assets/img/portfolio/room-within-room/model-21.webp
    - title: "Spatial Model — A Shared Interior Below Ground"
      description: |
        China.
