- title: "浙江万里学院余姚校区 / Zhejiang Wanli University"
  card_title: "Zhejiang Wanli University"
  year: 2025
  place: "Yuyao, Zhejiang, China"
  subtitle: "Zhejiang"
  country: "China"
  kind: "Landscape and Architectural Design"
  photo_title: "Landscape — Water, Lawn, and Colonnade"
  image: "/assets/img/portfolio/wanli-university/courtyard-pool.webp"
  image_large: "/assets/img/portfolio/wanli-university/courtyard-pool.webp"
  alt: "Reflecting pool and colonnade in the Zhejiang Wanli University Yuyao campus landscape design"
  description: "Yuyao, Zhejiang, China.\nCompleted project. Design-stage renderings shown.\nCampus landscape and teaching-building design studies. Campus planning refinement, landscape planning, and spatial design of key landscape nodes."
  count: 6
  aspect: "1800 / 1041"
  layout_span: 2
  photos:
    - title: "Landscape — Water, Lawn, and Colonnade"
      description: "Yuyao, Zhejiang, China.\nCompleted project. Design-stage renderings shown.\nA reflecting pool and curved colonnade form the edge of the central lawn, connecting teaching buildings with outdoor gathering spaces. Wenrui Xu participated in campus planning refinement and landscape planning and led the spatial design of key landscape nodes."
      image: "/assets/img/portfolio/wanli-university/courtyard-pool.webp"
      aspect: "1800 / 1041"
    - title: "Landscape — Campus Masterplan"
      description: "Yuyao, Zhejiang, China.\nThe landscape masterplan organizes named public spaces, planted routes, and water edges across the campus, connecting the entrance plazas with the central green."
      image: "/assets/img/portfolio/wanli-university/landscape-masterplan.webp"
      aspect: "2560 / 1569"
    - title: "South Entrance — A Shaded Tree Court"
      description: "Yuyao, Zhejiang, China.\nA regular tree canopy defines an outdoor room with loose seating, providing a setting for informal conversation beside the south entrance plaza."
      image: "/assets/img/portfolio/wanli-university/tree-court.webp"
      aspect: "2096 / 1181"
    - title: "Bamboo Court — A Quiet Campus Room"
      description: "Yuyao, Zhejiang, China.\nA bamboo grove, curving path, and integrated seating create an intimate space beside the teaching buildings."
      image: "/assets/img/portfolio/wanli-university/bamboo-court.webp"
      aspect: "1800 / 1014"
    - title: "Architecture — Intelligent Manufacturing Teaching Building"
      description: "Yuyao, Zhejiang, China.\nThe teaching-building concept uses a glazed central volume and warm-toned facade elements to define its public frontage and entrance."
      image: "/assets/img/portfolio/wanli-university/teaching-building.webp"
      aspect: "1834 / 1046"
    - title: "Architecture — A Daylit Teaching Atrium"
      description: "Yuyao, Zhejiang, China.\nThe interior concept organizes circulation around a skylit atrium with planted edges and shared space at ground level."
      image: "/assets/img/portfolio/wanli-university/teaching-atrium.webp"
      aspect: "1907 / 1046"

