      aspect: 1920 / 1280
      image: /assets/img/portfolio/room-within-room/model-17.webp
    - title: "Atmosphere — The Cliffside Plaza"
      description: |
        China.
        The cliffside plaza becomes a public edge for the guesthouse. The rendering brings together covered circulation, retained trees, and places to pause.
      aspect: 2560 / 1809
      image: /assets/img/portfolio/room-within-room/drawing-07.webp
    - title: "Atmosphere — The Village Book Bar"
      description: |
        China.
